                        url:
                          type: string
                          format: uri
                        secret_prefix:
                          type: string
                          example: whsec_ab12
                        events:
                          type: array
                          items:
                            type: string
                        filters:
                          properties:
                            call_status:
                              type: array
                              items:
                                type: string
                              example:
                              - missed_call
                              - no_answer
                            project_ids:
                              type: array
                              items:
                                type: integer
                              example:
                              - 456
                              - 789
                          type: object
                          nullable: true
                        is_active:
                          type: boolean
                        last_delivered_at:
                          type: string
                          format: date-time
                          nullable: true
                        consecutive_failures:
                          description: Consecutive failed delivery attempts, retries included. Reset to 0 by any successful delivery; at 10 the webhook is auto-disabled.
                          type: integer
                          example: 0
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                      type: object
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope webhooks:manage or license open_api_advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
    post:
      tags:
      - Webhooks
      summary: Create webhook
      description: 'Registers an endpoint URL to receive Comdesk events. Payloads are sent with an HMAC-SHA256 signature in the `X-Comdesk-Signature: sha256=<hex>` header. The exact body Comdesk will POST to your endpoint is defined by the **WebhookPayload** schema (see the Schemas section at the bottom of this page). Requires scope `webhooks:manage` and license `open_api_advanced`.'
      operationId: webhooksCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - url
              - events
              properties:
                url:
                  description: Webhook endpoint URL. Must be HTTPS — http:// URLs are rejected (400). Must also resolve to a public address (SSRF-protected).
                  type: string
                  format: uri
                  example: https://hooks.example.com/comdesk
                events:
                  description: Event types to subscribe to. call.started=call initiated, call.completed=call ended (answered), call.missed=no answer, call.voicemail=voicemail recording finished, customer.created / customer.updated=customer registered or updated, transcription.completed=speech-to-text finished, summary.completed=AI summary finished. call.failed and ivr.trigger are accepted for registration but have no producer yet (reserved values).
                  type: array
                  items:
                    type: string
                    enum:
                    - call.started
                    - call.completed
                    - call.missed
                    - call.voicemail
                    - call.failed
                    - customer.created
                    - customer.updated
                    - transcription.completed
                    - summary.completed
                    - ivr.trigger
                  example:
                  - call.completed
                  - call.missed
                filters:
                  description: REGISTRATION ONLY — filters are stored/validated for shape but NOT yet applied at delivery time; all subscribed events are delivered regardless. Filter values (call_status / project_ids) are not yet checked for existence. Delivery-time filtering is tracked separately.
                  properties:
                    call_status:
                      type: array
                      items:
                        type: string
                      example:
                      - missed_call
                      - no_answer
                    project_ids:
                      type: array
                      items:
                        type: integer
                      example:
                      - 456
                      - 789
                  type: object
                  nullable: true
                is_enabled:
                  type: boolean
                  example: true
                name:
                  type: string
                  example: Slack Notification — Missed Calls
                  nullable: true
              type: object
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Slack Notification
                        nullable: true
                      url:
                        type: string
                        format: uri
                      secret:
                        description: HMAC secret for X-Comdesk-Signature verification. Only shown on creation.
                        type: string
                        example: whsec_xxx
                      secret_prefix:
                        description: First 12 chars of the secret for identification.
                        type: string
                        example: whsec_ab12
                      events:
                        type: array
                        items:
                          type: string
                      filters:
                        properties:
                          call_status:
                            type: array
                            items:
                              type: string
                            example:
                            - missed_call
                            - no_answer
                          project_ids:
                            type: array
                            items:
                              type: integer
                            example:
                            - 456
                            - 789
                        type: object
                        nullable: true
                      is_active:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      message:
                        type: string
                        example: Store this secret now. It cannot be retrieved later.
                    type: object
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope webhooks:manage or license open_api_advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid URL or empty events array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-acceptance-criteria:
      - ✅ Client can register a URL endpoint to receive specific events (call.completed, call.missed, etc.)
      - ⚠️ Client can register call_status / project_ids filters — REGISTRATION ONLY. Delivery-time filtering is NOT yet applied (every subscribed event is still delivered regardless of filters); tracked as a separate ticket.
      - ✅ Payload is delivered with HMAC-SHA256 signature in the X-Comdesk-Signature header
      - ✅ Payload includes event_id (UUID v4) and timestamp (ISO8601, e.g. 2026-07-15T18:47:14+09:00) for replay protection
      - 🔒 Requires scope webhooks:manage
      - 🔒 Requires license open_api_advanced
