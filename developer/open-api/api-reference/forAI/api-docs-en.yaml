openapi: 3.0.0
info:
  title: Comdesk Lead Open API (EN)
  description: 'Open API for external CRM integration (Salesforce, HubSpot, etc.).


    Authentication uses an API key via the `Authorization: Bearer <api_key>` header.


    API keys can be issued from the tenant management page.


    ---

    🇯🇵 [日本語版 → /api/docs](/api/docs)'
  contact:
    name: Comdesk Developer Support
    email: dev@comdesk.com
  version: 1.0.0
servers:
- url: https://xxxx.comdesk.com
  description: Your tenant domain (replace xxxx with your subdomain)
paths:
  /api/v1/calls:
    get:
      tags:
      - Calls
      summary: List call history
      description: Returns call history with filters and pagination. Date range maximum is 31 days. Requires scope `calls:read`.
      operationId: callsList
      parameters:
      - name: from
        in: query
        description: Start date (YYYY-MM-DD). Maximum 180 days ago.
        required: true
        schema:
          type: string
          format: date
          example: '2026-03-01'
      - name: to
        in: query
        description: End date (YYYY-MM-DD). Maximum 31 days from 'from'.
        required: true
        schema:
          type: string
          format: date
          example: '2026-03-31'
      - name: project_id
        in: query
        description: Filter by project ID
        required: false
        schema:
          type: integer
      - name: staff_id
        in: query
        description: Filter by staff ID
        required: false
        schema:
          type: integer
      - name: call_type
        in: query
        description: Filter by call type
        required: false
        schema:
          type: string
          enum:
          - outbound
          - inbound
      - name: status
        in: query
        description: Filter by status (comma-separated)
        required: false
        schema:
          type: string
          example: connected,no_answer
      - name: phone_number
        in: query
        description: Partial match on phone number
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: started_at
          enum:
          - started_at
          - duration
      - name: order
        in: query
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Call history list
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CallHistoryItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope calls:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Date range exceeds 31 days or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-acceptance-criteria:
      - ✅ Client can retrieve call history with date-range filter (from, to), project, staff, and status
      - ❌ Date range is at most 31 days per request; exceeding returns HTTP 422
      - ✅ Supports pagination (page, per_page max 200)
      - ✅ Response includes transcription, summary, speech_analysis, recording_url, and external_id
      - 🔒 Requires scope calls:read
  /api/v1/calls/{callId}:
    get:
      tags:
      - Calls
      summary: Get call detail
      description: Returns detailed information for a single call including transcription, summary, and speech analysis. Requires scope `calls:read`.
      operationId: callsDetail
      parameters:
      - name: callId
        in: path
        description: Call ID
        required: true
        schema:
          type: integer
          example: 12345
      responses:
        '200':
          description: Call detail
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CallHistoryItem'
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope calls:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Call not found in this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-acceptance-criteria:
      - ✅ Client can retrieve full detail of a single call by callId
      - ✅ Response includes all fields including transcription, summary, and speech_analysis
      - ❌ Returns HTTP 404 when callId is not found within the same tenant
      - 🔒 Requires scope calls:read
  /api/v1/customers:
    get:
      tags:
      - Customers
      summary: List customers
      description: Returns a paginated customer list with optional filters. Requires scope `customers:read`.
      operationId: customersList
      parameters:
      - name: project_id
        in: query
        description: Filter by project ID (required)
        required: true
        schema:
          type: integer
      - name: external_id
        in: query
        description: Exact match on the external system ID (returns 0 or 1 record)
        required: false
        schema:
          type: string
          maxLength: 255
      - name: search
        in: query
        description: Partial match on name or phone number
        required: false
        schema:
          type: string
          maxLength: 255
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - created_at
          - updated_at
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        customer_id:
                          type: integer
                          example: 78901
                        external_id:
                          type: string
                          example: CRM-LEAD-001
                          nullable: true
                        name:
                          type: string
                          example: Test Corporation
                        tel1:
                          type: string
                          example: 0312345678
                        project_id:
                          type: integer
                          example: 456
                      type: object
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope customers:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
    post:
      tags:
      - Customers
      summary: Create customer
      description: Registers a new customer. Use `external_id` to link with CRM records. Requires scope `customers:write`.
      operationId: customersCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - project_id
              - name
              properties:
                project_id:
                  type: integer
                  example: 456
                external_id:
                  type: string
                  example: CRM-LEAD-001
                  nullable: true
                  maxLength: 255
                name:
                  type: string
                  example: Test Corporation
                  maxLength: 255
                name_kana:
                  type: string
                  example: Tesuto Kabushiki Kaisha
                  nullable: true
                  maxLength: 255
                tel1:
                  description: E.164 (+819012345678) or a domestic number starting with 0 (0312345678); hyphens allowed as separators. Any other format is rejected with 422.
                  type: string
                  pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                  example: 0312345678
                  nullable: true
                  maxLength: 30
                tel2:
                  description: Same format rules as tel1.
                  type: string
                  pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                  example: 09012345678
                  nullable: true
                  maxLength: 30
                prefecture:
                  type: string
                  example: Tokyo
                  nullable: true
                address1:
                  type: string
                  example: 1-1-1 Shibuya, Shibuya-ku
                  nullable: true
                industry:
                  type: string
                  example: IT
                  nullable: true
                employee_scale:
                  type: string
                  example: 100-299
                  nullable: true
                custom_fields:
                  type: object
                  example:
                    field_1: custom value
                  nullable: true
              type: object
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      customer_id:
                        type: integer
                        example: 78901
                      external_id:
                        type: string
                        example: CRM-LEAD-001
                        nullable: true
                      name:
                        type: string
                        example: Test Corporation
                      project_id:
                        type: integer
                        example: 456
                      created_at:
                        type: string
                        format: date-time
                    type: object
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope customers:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate external_id within the same project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-acceptance-criteria:
      - ✅ Client can register a new customer with external_id for CRM correlation
      - ✅ Response 201 contains customer_id that can be stored in the CRM for subsequent requests
      - ❌ Request with duplicate external_id (within the same project) returns HTTP 409
      - 🔒 Requires scope customers:write
  /api/v1/customers/bulk:
    post:
      tags:
      - Customers
      summary: Bulk create customers (asynchronous)
      description: Queues up to 500 customers for registration and returns immediately with a `batch_id`. The records are **not** created before the response is sent — poll `GET /api/v1/customers/bulk/{batch_id}` for the per-record outcome. Requires scope `customers:write`.
      operationId: customersBulkCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - customers
              properties:
                customers:
                  type: array
                  items:
                    required:
                    - project_id
                    - name
                    properties:
                      project_id:
                        type: integer
                        example: 456
                      external_id:
                        type: string
                        nullable: true
                        maxLength: 255
                      name:
                        type: string
                        example: Test Corporation
                        maxLength: 255
                      tel1:
                        description: E.164 or a domestic number starting with 0; hyphens allowed as separators. A malformed number rejects the whole batch with 422.
                        type: string
                        pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                        example: 0312345678
                        nullable: true
                        maxLength: 30
                      tel2:
                        description: Same format rules as tel1.
                        type: string
                        pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                        example: 09012345678
                        nullable: true
                        maxLength: 30
                    type: object
                  maxItems: 500
              type: object
      responses:
        '202':
          description: Batch accepted and queued. No customer has been created yet.
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      batch_id:
                        description: Use this to poll GET /api/v1/customers/bulk/{batch_id}
                        type: string
                        format: uuid
                        example: b3f1c2a0-9d7e-4c11-88a2-1f0b5c6de9d4
                      status:
                        type: string
                        example: pending
                        enum:
                        - pending
                      total:
                        description: Number of records accepted for processing
                        type: integer
                        example: 100
                    type: object
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope customers:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Empty array or exceeds 500 records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/customers/bulk/{batch_id}:
    get:
      tags:
      - Customers
      summary: Get bulk create status
      description: Returns the progress and per-record outcome of a batch submitted via `POST /api/v1/customers/bulk`. Poll every few seconds; roughly 80ms per record is a reasonable expectation. Requires scope `customers:write`.
      operationId: customersBulkStatus
      parameters:
      - name: batch_id
        in: path
        description: The batch_id returned by POST /api/v1/customers/bulk
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Batch status
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      batch_id:
                        type: string
                        format: uuid
                        example: b3f1c2a0-9d7e-4c11-88a2-1f0b5c6de9d4
                      status:
                        description: '`pending` (queued, not started) → `processing` → `completed` / `failed`. A batch left `pending` beyond the configured wait is reported as `failed` with a `failure_reason`, so polling always reaches a terminal state.'
                        type: string
                        example: completed
                        enum:
                        - pending
                        - processing
                        - completed
                        - failed
                      total:
                        description: Total number of records submitted
                        type: integer
                        example: 100
                      succeeded:
                        type: integer
                        example: 97
                      failed:
                        type: integer
                        example: 3
                      results:
                        description: One entry per successfully created record. Empty until the batch completes.
                        type: array
                        items:
                          properties:
                            index:
                              description: Index of the record in the submitted customers array
                              type: integer
                              example: 0
                            status:
                              type: string
                              example: created
                            customer_id:
                              type: integer
                              example: 78901
                            external_id:
                              type: string
                              example: CRM-LEAD-001
                              nullable: true
                          type: object
                      errors:
                        description: One entry per record that failed to create. Empty until the batch completes.
                        type: array
                        items:
                          properties:
                            index:
                              description: Index of the record in the submitted customers array
                              type: integer
                              example: 1
                            code:
                              type: string
                              example: duplicate_external_id
                            message:
                              type: string
                              example: Duplicate external_id within the same project.
                          type: object
                      failure_reason:
                        description: Why the batch failed. Set only when `status` is `failed`; null otherwise.
                        type: string
                        example: Queue worker did not start this batch within 15 minutes. The openapi queue is not being consumed on this environment; the records were not created. Re-submit the batch once the worker is running.
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                        example: '2026-08-11T18:47:14+09:00'
                      started_at:
                        type: string
                        format: date-time
                        example: '2026-08-11T18:47:15+09:00'
                        nullable: true
                      completed_at:
                        type: string
                        format: date-time
                        example: '2026-08-11T18:47:53+09:00'
                        nullable: true
                    type: object
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope customers:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Batch not found, or it belongs to another tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/customers/{customerId}:
    get:
      tags:
      - Customers
      summary: Get customer detail
      description: Returns detailed information for a single customer. Requires scope `customers:read`.
      operationId: customersShow
      parameters:
      - name: customerId
        in: path
        description: Customer ID
        required: true
        schema:
          type: integer
          example: 78901
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      customer_id:
                        type: integer
                        example: 78901
                      external_id:
                        type: string
                        nullable: true
                      name:
                        type: string
                        example: Test Corporation
                      name_kana:
                        type: string
                        nullable: true
                      tel1:
                        type: string
                        example: 0312345678
                      tel2:
                        type: string
                        nullable: true
                      prefecture:
                        type: string
                        nullable: true
                      address1:
                        type: string
                        nullable: true
                      industry:
                        type: string
                        nullable: true
                      employee_scale:
                        type: string
                        nullable: true
                      custom_fields:
                        type: object
                        nullable: true
                      project_id:
                        type: integer
                        example: 456
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                    type: object
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope customers:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
    put:
      tags:
      - Customers
      summary: Update customer
      description: Updates an existing customer. Omitted fields are not changed. Requires scope `customers:write`.
      operationId: customersUpdate
      parameters:
      - name: customerId
        in: path
        description: Customer ID
        required: true
        schema:
          type: integer
          example: 78901
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  example: Test Corporation (updated)
                  nullable: true
                name_kana:
                  type: string
                  nullable: true
                tel1:
                  description: E.164 or a domestic number starting with 0; hyphens allowed as separators. Any other format is rejected with 422. Send null to clear the field.
                  type: string
                  pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                  example: 0312345679
                  nullable: true
                  maxLength: 30
                tel2:
                  description: Same format rules as tel1.
                  type: string
                  pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                  nullable: true
                  maxLength: 30
                prefecture:
                  type: string
                  nullable: true
                address1:
                  type: string
                  nullable: true
                industry:
                  type: string
                  nullable: true
                employee_scale:
                  type: string
                  nullable: true
                custom_fields:
                  type: object
                  nullable: true
              type: object
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      customer_id:
                        type: integer
                        example: 78901
                      name:
                        type: string
                        example: Test Corporation (updated)
                      updated_at:
                        type: string
                        format: date-time
                    type: object
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope customers:write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/reports/summary:
    get:
      tags:
      - Reports
      summary: Get call statistics summary
      description: Returns aggregated call statistics for a given period. Maximum 31 days, maximum 180 days ago. Requires scope `reports:read` and license `open_api_advanced`.
      operationId: reportsSummary
      parameters:
      - name: from
        in: query
        description: Start date (YYYY-MM-DD)
        required: true
        schema:
          type: string
          format: date
          example: '2026-05-01'
      - name: to
        in: query
        description: End date (YYYY-MM-DD)
        required: true
        schema:
          type: string
          format: date
          example: '2026-05-14'
      - name: project_id
        in: query
        description: Filter by project ID
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Aggregated statistics
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      from:
                        type: string
                        format: date
                        example: '2026-05-01'
                      to:
                        type: string
                        format: date
                        example: '2026-05-14'
                      total_calls:
                        type: integer
                        example: 1250
                      total_out_calls:
                        type: integer
                        example: 980
                      total_out_connected:
                        type: integer
                        example: 412
                      total_in_calls:
                        type: integer
                        example: 270
                      total_in_connected:
                        type: integer
                        example: 198
                      connection_rate:
                        description: Outbound connection rate (%)
                        type: number
                        format: float
                        example: 42.04
                      total_duration_seconds:
                        type: integer
                        example: 183600
                      total_mybox:
                        type: integer
                        example: 87
                      total_appoints:
                        type: integer
                        example: 34
                    type: object
                type: object
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient scope reports:read or license open_api_advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Date range exceeds 31 days, from is more than 180 days ago, or invalid params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/reports/calls:
    get:
      tags:
      - Reports
      summary: Get call breakdown report
      description: Returns per-staff or per-project call breakdown data. Requires scope `reports:read` and license `open_api_advanced`.
      operationId: reportsCalls
      parameters:
      - name: from
        in: query
        description: Start date (YYYY-MM-DD)
        required: true
        schema:
