components:
  schemas:
    ErrorResponse:
      required:
      - error
      properties:
        error:
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: invalid_api_key
            message:
              type: string
              example: Missing or invalid API key.
            details:
              example: null
              nullable: true
          type: object
      type: object
    ValidationErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: Validation failed.
            details:
              type: object
              example:
                phone_number:
                - The phone number field is required.
          type: object
      type: object
    PaginationMeta:
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 50
        total:
          type: integer
          example: 128
        last_page:
          type: integer
          example: 3
      type: object
    SpeechAnalysis:
      properties:
        talk_ratio:
          description: Agent talk ratio (0–1)
          type: number
          format: float
          example: 0.45
        speech_speed:
          description: Speech speed (chars/sec)
          type: number
          format: float
          example: 5.2
        filler_count:
          description: Number of filler words
          type: integer
          example: 3
        silence_ratio:
          description: Silence ratio
          type: number
          format: float
          example: 0.08
        overlap_count:
          description: Number of speech overlaps
          type: integer
          example: 2
        question_count:
          description: Number of questions asked
          type: integer
          example: 8
        rally_count:
          description: Number of turn exchanges
          type: integer
          example: 15
      type: object
      nullable: true
    CallHistoryItem:
      properties:
        call_id:
          description: Call history ID. Same integer accepted by GET /api/v1/calls/{callId}.
          type: integer
          format: int64
          example: 150193036
        call_type:
          description: Call type. `voicemail` covers both inbound calls recorded by the tenant's own answering machine and outbound calls answered by the counterpart's voicemail.
          type: string
          example: outbound
          enum:
          - outbound
          - inbound
          - outbound_no_answer
          - inbound_no_answer
          - internal
          - voicemail
          - transfer
          - sms_inbound
          - sms_outbound
          - ivr_outbound
        status:
          type: string
          example: connected
        phone_number:
          type: string
          example: 09012345678
        caller_number:
          type: string
          example: 0312345678
        staff_id:
          type: integer
          example: 123
        staff_name:
          type: string
          example: Tanaka Taro
        project_id:
          type: integer
          example: 456
        project_name:
          type: string
          example: Sales Project A
        customer_id:
          type: integer
          example: 78901
          nullable: true
        customer_name:
          type: string
          example: Test Corporation
          nullable: true
        started_at:
          type: string
          format: date-time
          example: '2026-03-10T10:00:00+09:00'
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          example: 330
        memo:
          type: string
          example: Appointment secured
          nullable: true
        recall_at:
          type: string
          format: date-time
          nullable: true
        transcription:
          description: Speech-to-text transcription
          type: string
          nullable: true
        summary:
          description: AI-generated call summary
          type: string
          nullable: true
        speech_analysis:
          oneOf:
          - $ref: '#/components/schemas/SpeechAnalysis'
          nullable: true
        recording_url:
          type: string
          format: uri
          nullable: true
        external_id:
          type: string
          example: SF-LEAD-001
          nullable: true
      type: object
    WebhookPayload:
      description: "Request body Comdesk POSTs to a registered webhook URL.\n *\n * **Transport**\n * - `POST <your registered url>` with `Content-Type: application/json`. Only `https://` URLs are delivered to.\n * - `X-Comdesk-Signature: sha256=<hex>` — HMAC-SHA256 of the **raw request body bytes**, keyed with the webhook secret shown once at creation.\n * - `X-Comdesk-Event: <event>` — same value as the `event` property.\n * - `X-Comdesk-Delivery: <event_id>` — same value as the `event_id` property (not sent for `webhook.test`).\n * - `User-Agent: Comdesk-Webhook/1.0` (`Comdesk-Webhook-Tester/1.0` for `webhook.test`).\n *\n * **Verifying the signature** — compute the HMAC over the raw body exactly as received. Re-serialising the parsed JSON produces a different byte sequence and the comparison will fail.\n *\n * **Delivery semantics** — up to 6 attempts with backoff 1m → 5m → 30m → 2h → 24h; 4xx/5xx and timeouts (10s) are retried. Retries reuse the same `event_id`, so consumers must be\
        \ idempotent on it.\n *\n * **Auto-disable** — after **10 consecutive failed attempts** the webhook is set to `is_active: false` and stops receiving events until you re-enable it with `PUT /api/v1/webhooks/{webhookId}`. The counter is `consecutive_failures`: every failed *attempt* increments it (retries included, not one per event), and any single successful delivery resets it to 0. Because the threshold is above the 6-attempt ceiling, one unreachable event can never disable a webhook on its own — it takes roughly two consecutive events that exhaust their retries.\n *\n * **`data` shape** is determined by `event` — see the per-event schemas below."
      required:
      - event_id
      - timestamp
      - event
      - data
      properties:
        event_id:
          description: UUID v4. Stable across retries of the same event — use it for replay/duplicate protection.
          type: string
          format: uuid
          example: 9b7a1f2c-3d4e-4f50-9a61-2b3c4d5e6f70
        timestamp:
          description: ISO8601 with offset, in the Comdesk app timezone (Asia/Tokyo, +09:00). Fixed at dispatch time, not at retry time.
          type: string
          format: date-time
          example: '2026-07-15T18:47:14+09:00'
        event:
          description: '`webhook.test` is only produced by `POST /api/v1/webhooks/{webhookId}/test` and cannot be subscribed to. `call.failed` and `ivr.trigger` can be registered but have no producer at present (reserved values).'
          type: string
          example: call.completed
          enum:
          - call.started
          - call.completed
          - call.missed
          - call.voicemail
          - call.failed
          - customer.created
          - customer.updated
          - transcription.completed
          - summary.completed
          - ivr.trigger
          - webhook.test
        data:
          description: 'Event-specific body — pick the variant by `event`, not by shape (`anyOf`, not `oneOf`: WebhookCallStartedData is a strict subset of WebhookCallEndedData, so a call-ended payload legitimately matches both). call.started → WebhookCallStartedData; call.completed / call.missed / call.voicemail → WebhookCallEndedData; customer.created → WebhookCustomerCreatedData; customer.updated → WebhookCustomerUpdatedData; transcription.completed → WebhookTranscriptionCompletedData; summary.completed → WebhookSummaryCompletedData; ivr.trigger → WebhookIvrTriggerData; call.failed → WebhookCallFailedData; webhook.test → WebhookTestData.'
          anyOf:
          - $ref: '#/components/schemas/WebhookCallStartedData'
          - $ref: '#/components/schemas/WebhookCallEndedData'
          - $ref: '#/components/schemas/WebhookCustomerCreatedData'
          - $ref: '#/components/schemas/WebhookCustomerUpdatedData'
          - $ref: '#/components/schemas/WebhookTranscriptionCompletedData'
          - $ref: '#/components/schemas/WebhookSummaryCompletedData'
          - $ref: '#/components/schemas/WebhookIvrTriggerData'
          - $ref: '#/components/schemas/WebhookCallFailedData'
          - $ref: '#/components/schemas/WebhookTestData'
      type: object
    WebhookCallStartedData:
      description: Sent when a call record is created (call initiated). Produced by the CRM call-create path.
      required:
      - call_id
      properties:
        call_id:
          description: Call history ID (integer).
          type: integer
          format: int64
          example: 1234567
        phone_number:
          type: string
          example: 09012345678
          nullable: true
        staff_id:
          type: integer
          example: 123
          nullable: true
        project_id:
          type: integer
          example: 456
          nullable: true
        started_at:
          type: string
          format: date-time
          example: '2026-07-15T18:42:01+09:00'
          nullable: true
      type: object
    WebhookCallEndedData:
      description: Sent when the PBX reports the call ended. `call.completed` = answered, `call.missed` = not answered, `call.voicemail` = ended on an answering machine recording.
      required:
      - call_id
      properties:
        call_id:
          type: integer
          format: int64
          example: 1234567
        phone_number:
          type: string
          example: 09012345678
          nullable: true
        staff_id:
          type: integer
          example: 123
          nullable: true
        project_id:
          type: integer
          example: 456
          nullable: true
        started_at:
          type: string
          format: date-time
          example: '2026-07-15T18:42:01+09:00'
          nullable: true
        duration_seconds:
          description: Talk duration in seconds. `null` when the call never connected.
          type: integer
          example: 330
          nullable: true
      type: object
    WebhookCustomerCreatedData:
      description: Sent on `POST /api/v1/customers` when a new record is created.
      required:
      - customer_id
      properties:
        customer_id:
          type: integer
          format: int64
          example: 78901
        name:
          type: string
          example: Test Corporation
          nullable: true
        tel1:
          type: string
          example: 0312345678
          nullable: true
        project_id:
          type: integer
          example: 456
          nullable: true
        external_id:
          type: string
          example: SF-LEAD-001
          nullable: true
      type: object
    WebhookCustomerUpdatedData:
      description: Sent on `PATCH /api/v1/customers/{customerId}` when an existing record is updated.
      required:
      - customer_id
      properties:
        customer_id:
          type: integer
          format: int64
          example: 78901
        changed_fields:
          description: Names of the request fields that were submitted for update.
          type: array
          items:
            type: string
          example:
          - name
          - tel1
        external_id:
          type: string
          example: SF-LEAD-001
          nullable: true
      type: object
    WebhookTranscriptionCompletedData:
      required:
      - call_id
      - transcription
      properties:
        call_id:
          type: integer
          format: int64
          example: 1234567
        transcription:
          description: Speech-to-text result, truncated to the first 5000 characters. Fetch `GET /api/v1/calls/{callId}` for the full text.
          type: string
          example: Hello, this is Tanaka from Comdesk…
          maxLength: 5000
      type: object
    WebhookSummaryCompletedData:
      required:
      - call_id
      - summary
      properties:
        call_id:
          type: integer
          format: int64
          example: 1234567
        summary:
          description: AI-generated summary, truncated to the first 5000 characters.
          type: string
          example: Customer requested a quote and asked for a callback next week.
          maxLength: 5000
      type: object
    WebhookIvrTriggerData:
      description: Sent when an IVR session has been accepted and queued. No producer at present, so this event is not delivered (reserved value).
      required:
      - session_id
      - call_id
      - phone_number
      - project_id
      - initiated_at
      properties:
        session_id:
          description: '`ivr_` + call_id.'
          type: string
          example: ivr_1234567
        call_id:
          type: integer
          format: int64
          example: 1234567
        phone_number:
          type: string
          example: 09012345678
        project_id:
          type: integer
          example: 456
        queue_id:
          type: integer
          example: 12
          nullable: true
        external_id:
          type: string
          example: SF-LEAD-001
          nullable: true
        initiated_at:
          type: string
          format: date-time
          example: '2026-07-15T18:42:01+09:00'
      type: object
    WebhookCallFailedData:
      description: Sent when an accepted call could not actually be placed — the request was answered but the PBX never dialled. No producer at present, so this event is not delivered (reserved value).
      required:
      - call_id
      - reason
      - failed_at
      properties:
        call_id:
          type: integer
          format: int64
          example: 1234567
        customer_id:
          type: integer
          format: int64
          example: 78901
          nullable: true
        reason:
          description: staff_not_dialable = the staff member has no dialable PBX user; pbx_unconfigured = no dial endpoint configured for this environment; pbx_host_unknown = the staff member\'s PBX host could not be resolved; pbx_rejected = the PBX refused the call; pbx_unreachable = the PBX could not be reached after retries.
          type: string
          example: pbx_rejected
          enum:
          - staff_not_dialable
          - pbx_unconfigured
          - pbx_host_unknown
          - pbx_rejected
          - pbx_unreachable
        failed_at:
          type: string
          format: date-time
          example: '2026-07-15T18:42:09+09:00'
      type: object
    WebhookTestData:
      description: Only produced by `POST /api/v1/webhooks/{webhookId}/test`. This event cannot be subscribed to and is never retried.
      required:
      - webhook_id
      - message
      properties:
        webhook_id:
          type: integer
          example: 1
        message:
          type: string
          example: This is a test event from Comdesk.
      type: object
  securitySchemes:
    BearerAuth:
      type: http
      description: API key from the api_keys table. Enter without the 'Bearer ' prefix.
      scheme: bearer
tags:
- name: Calls
  description: Calls
- name: Customers
  description: Customers
- name: Reports
  description: Reports
- name: Webhooks
  description: Webhooks
