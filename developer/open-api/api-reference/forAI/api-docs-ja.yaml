                        is_active:
                          type: boolean
                        last_delivered_at:
                          type: string
                          format: date-time
                          nullable: true
                        consecutive_failures:
                          description: 連続した配信試行の失敗回数（再送を含む）。配信が成功すると 0 にリセットされ、10 に達するとWebhookは自動的に無効化されます。
                          type: integer
