          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
    post:
      tags:
      - Webhook
      summary: Webhook登録
      description: 'Comdeskイベントを受信するエンドポイントURLを登録します。ペイロードは `X-Comdesk-Signature: sha256=<hex>` ヘッダーにHMAC-SHA256署名付きで送信されます。実際にPOSTされる本文の定義は **WebhookPayload** スキーマ(本ページ下部のSchemas)を参照してください。スコープ `webhooks:manage` とライセンス `open_api_advanced` が必要です。'
      operationId: webhooksCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - url
              - events
              properties:
                url:
                  description: Webhook送信先URL。https必須 — http:// のURLは拒否されます(400)。またパブリックなアドレスに解決される必要があります(SSRF対策)。
                  type: string
                  format: uri
                  example: https://hooks.example.com/comdesk
                events:
                  description: 購読するイベント種別。call.started=発信/着信開始、call.completed=通話終了(応答あり)、call.missed=不在(応答なし)、call.voicemail=留守録の録音終了、customer.created / customer.updated=顧客の登録・更新、transcription.completed=文字起こし完了、summary.completed=要約完了。call.failed と ivr.trigger は登録できますが、現時点で配信元がありません(予約値)。
                  type: array
                  items:
                    type: string
                    enum:
                    - call.started
                    - call.completed
                    - call.missed
                    - call.voicemail
                    - call.failed
                    - customer.created
                    - customer.updated
                    - transcription.completed
                    - summary.completed
                    - ivr.trigger
                  example:
                  - call.completed
                  - call.missed
                filters:
                  description: 登録のみ — filtersは形式チェック・保存はされますが、配信時にはまだ適用されません（購読中の全イベントが配信されます）。フィルタ値（call_status / project_ids）の実在チェックも未実装です。配信時フィルタリングは別チケットで対応。
                  properties:
                    call_status:
                      type: array
                      items:
                        type: string
                      example:
                      - missed_call
                      - no_answer
                    project_ids:
                      type: array
                      items:
                        type: integer
                      example:
                      - 456
                      - 789
                  type: object
                  nullable: true
                is_enabled:
                  type: boolean
                  example: true
                name:
                  type: string
                  example: Slack通知 — 不在着信
                  nullable: true
              type: object
      responses:
        '201':
          description: Webhookが正常に登録されました
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Slack通知
                        nullable: true
                      url:
                        type: string
                        format: uri
                      secret:
                        description: X-Comdesk-Signature検証用のHMACシークレット。登録時のみ表示されます。
                        type: string
                        example: whsec_xxx
                      secret_prefix:
                        description: シークレットの先頭12文字（識別用）
                        type: string
                        example: whsec_ab12
                      events:
                        type: array
                        items:
                          type: string
                      filters:
                        properties:
                          call_status:
                            type: array
                            items:
                              type: string
                            example:
                            - missed_call
                            - no_answer
                          project_ids:
                            type: array
                            items:
                              type: integer
                            example:
                            - 456
                            - 789
                        type: object
                        nullable: true
                      is_active:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      message:
                        type: string
                        example: このシークレットは今すぐ保存してください。後から取得することはできません。
                    type: object
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ webhooks:manage またはライセンス open_api_advanced が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: URLが無効またはeventsが空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-acceptance-criteria:
      - ✅ 特定イベント（call.completed、call.missedなど）を受信するURLエンドポイントを登録できること
      - ⚠️ call_status / project_ids フィルタを登録できること — 登録のみ。配信時のフィルタ適用は未対応（フィルタに関わらず購読中の全イベントが配信されます）。配信時フィルタリングは別チケットで管理。
      - ✅ ペイロードがX-Comdesk-SignatureヘッダーにHMAC-SHA256署名付きで配信されること
      - '✅ リプレイ保護のためevent_id（UUID v4）とtimestamp（ISO8601形式、例: 2026-07-15T18:47:14+09:00）がペイロードに含まれること'
      - 🔒 スコープ webhooks:manage が必要
      - 🔒 ライセンス open_api_advanced が必要
