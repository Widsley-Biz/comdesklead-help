openapi: 3.0.0
info:
  title: Comdesk Lead Open API
  description: '外部CRM（Salesforce、HubSpotなど）との統合のためのOpen APIです。


    認証はAPIキーを使用し、`Authorization: Bearer <api_key>` ヘッダーで送信します。


    APIキーはテナント管理画面から発行できます。


    ---

    🇬🇧 [English version → /api/docs/en](/api/docs/en)'
  contact:
    name: Comdesk デベロッパーサポート
    email: dev@comdesk.com
  version: 1.0.0
servers:
- url: https://xxxx.comdesk.com
  description: テナントのドメイン（xxxx をご利用のサブドメインに置き換えてください）
paths:
  /api/v1/calls:
    get:
      tags:
      - 通話（Calls）
      summary: 通話履歴一覧取得
      description: フィルタとページネーション付きで通話履歴を取得します。日付範囲は最大31日間です。スコープ `calls:read` が必要です。
      operationId: callsList
      parameters:
      - name: from
        in: query
        description: 開始日（YYYY-MM-DD）。最大180日前まで。
        required: true
        schema:
          type: string
          format: date
          example: '2026-03-01'
      - name: to
        in: query
        description: 終了日（YYYY-MM-DD）。fromから最大31日間。
        required: true
        schema:
          type: string
          format: date
          example: '2026-03-31'
      - name: project_id
        in: query
        description: プロジェクトIDでフィルタ
        required: false
        schema:
          type: integer
      - name: staff_id
        in: query
        description: スタッフIDでフィルタ
        required: false
        schema:
          type: integer
      - name: call_type
        in: query
        description: 通話種別でフィルタ
        required: false
        schema:
          type: string
          enum:
          - outbound
          - inbound
      - name: status
        in: query
        description: ステータスでフィルタ（カンマ区切り）
        required: false
        schema:
          type: string
          example: connected,no_answer
      - name: phone_number
        in: query
        description: 電話番号の部分一致検索
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: started_at
          enum:
          - started_at
          - duration
      - name: order
        in: query
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: 通話履歴一覧
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CallHistoryItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ calls:read が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 日付範囲が31日超、またはパラメータが無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-acceptance-criteria:
      - ✅ 日付範囲フィルタ（from、to）、プロジェクト、スタッフ、ステータスで通話履歴を取得できること
      - ❌ 日付範囲は1リクエストあたり最大31日間。超過するとHTTP 422を返すこと
      - ✅ ページネーション対応（page、per_page 最大200）
      - ✅ レスポンスにtranscription、summary、speech_analysis、recording_url、external_idが含まれること
      - 🔒 スコープ calls:read が必要
  /api/v1/calls/{callId}:
    get:
      tags:
      - 通話（Calls）
      summary: 通話詳細取得
      description: 文字起こし、要約、音声解析を含む通話の詳細情報を取得します。スコープ `calls:read` が必要です。
      operationId: callsDetail
      parameters:
      - name: callId
        in: path
        description: 通話ID
        required: true
        schema:
          type: integer
          example: 12345
      responses:
        '200':
          description: 通話詳細
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CallHistoryItem'
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ calls:read が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: このテナント内に通話が見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-acceptance-criteria:
      - ✅ callIdで単一通話の全詳細を取得できること
      - ✅ transcription、summary、speech_analysisを含むすべてのフィールドがレスポンスに含まれること
      - ❌ 同一テナント内でcallIdが見つからない場合、HTTP 404を返すこと
      - 🔒 スコープ calls:read が必要
  /api/v1/customers:
    get:
      tags:
      - 顧客（Customers）
      summary: 顧客一覧取得
      description: フィルタとページネーション付きで顧客一覧を取得します。スコープ `customers:read` が必要です。
      operationId: customersList
      parameters:
      - name: project_id
        in: query
        description: プロジェクトIDでフィルタ（必須）
        required: true
        schema:
          type: integer
      - name: external_id
        in: query
        description: 外部システムIDの完全一致検索（結果は0件または1件）
        required: false
        schema:
          type: string
          maxLength: 255
      - name: search
        in: query
        description: 名前・電話番号の部分一致検索
        required: false
        schema:
          type: string
          maxLength: 255
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - created_at
          - updated_at
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
        '200':
          description: 顧客一覧
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        customer_id:
                          type: integer
                          example: 78901
                        external_id:
                          type: string
                          example: CRM-LEAD-001
                          nullable: true
                        name:
                          type: string
                          example: 株式会社テスト
                        tel1:
                          type: string
                          example: 0312345678
                        project_id:
                          type: integer
                          example: 456
                      type: object
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ customers:read が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
    post:
      tags:
      - 顧客（Customers）
      summary: 顧客登録
      description: 新規顧客を登録します。`external_id` はCRM側レコードとの紐付けに使用します。スコープ `customers:write` が必要です。
      operationId: customersCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - project_id
              - name
              properties:
                project_id:
                  type: integer
                  example: 456
                external_id:
                  type: string
                  example: CRM-LEAD-001
                  nullable: true
                  maxLength: 255
                name:
                  type: string
                  example: 株式会社テスト
                  maxLength: 255
                name_kana:
                  type: string
                  example: カブシキガイシャテスト
                  nullable: true
                  maxLength: 255
                tel1:
                  description: 電話番号。E.164形式（+819012345678）または0始まりの国内形式（0312345678）。区切りのハイフンは可。それ以外の形式は422で拒否されます。
                  type: string
                  pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                  example: 0312345678
                  nullable: true
                  maxLength: 30
                tel2:
                  description: tel1と同じ形式ルールです。
                  type: string
                  pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                  example: 09012345678
                  nullable: true
                  maxLength: 30
                prefecture:
                  type: string
                  example: 東京都
                  nullable: true
                address1:
                  type: string
                  example: 渋谷区渋谷1-1-1
                  nullable: true
                industry:
                  type: string
                  example: IT
                  nullable: true
                employee_scale:
                  type: string
                  example: 100-299
                  nullable: true
                custom_fields:
                  type: object
                  example:
                    field_1: カスタム値
                  nullable: true
              type: object
      responses:
        '201':
          description: 顧客が正常に登録されました
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      customer_id:
                        type: integer
                        example: 78901
                      external_id:
                        type: string
                        example: CRM-LEAD-001
                        nullable: true
                      name:
                        type: string
                        example: 株式会社テスト
                      project_id:
                        type: integer
                        example: 456
                      created_at:
                        type: string
                        format: date-time
                    type: object
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ customers:write が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同一プロジェクト内でexternal_idが重複しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-acceptance-criteria:
      - ✅ CRM紐付け用のexternal_idを使って新規顧客を登録できること
      - ✅ レスポンス201に、後続リクエスト用にCRMに保存可能なcustomer_idが含まれること
      - ❌ 同一プロジェクト内でexternal_idが重複する場合、HTTP 409を返すこと
      - 🔒 スコープ customers:write が必要
  /api/v1/customers/bulk:
    post:
      tags:
      - 顧客（Customers）
      summary: 顧客一括登録（非同期）
      description: 最大500件の顧客登録をキューに投入し、`batch_id` を即座に返します。レスポンス時点では顧客はまだ作成されて**いません**。各レコードの結果は `GET /api/v1/customers/bulk/{batch_id}` をポーリングして取得してください。スコープ `customers:write` が必要です。
      operationId: customersBulkCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - customers
              properties:
                customers:
                  type: array
                  items:
                    required:
                    - project_id
                    - name
                    properties:
                      project_id:
                        type: integer
                        example: 456
                      external_id:
                        type: string
                        nullable: true
                        maxLength: 255
                      name:
                        type: string
                        example: 株式会社テスト
                        maxLength: 255
                      tel1:
                        description: E.164形式または0始まりの国内形式。区切りのハイフンは可。形式不正が1件でもあるとバッチ全体が422で拒否されます。
                        type: string
                        pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                        example: 0312345678
                        nullable: true
                        maxLength: 30
                      tel2:
                        description: tel1と同じ形式ルールです。
                        type: string
                        pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                        example: 09012345678
                        nullable: true
                        maxLength: 30
                    type: object
                  maxItems: 500
              type: object
      responses:
        '202':
          description: 一括登録を受け付けキューに投入しました。この時点では顧客はまだ作成されていません。
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      batch_id:
                        description: GET /api/v1/customers/bulk/{batch_id} のポーリングに使用します
                        type: string
                        format: uuid
                        example: b3f1c2a0-9d7e-4c11-88a2-1f0b5c6de9d4
                      status:
                        type: string
                        example: pending
                        enum:
                        - pending
                      total:
                        description: 処理対象として受け付けたレコード数
                        type: integer
                        example: 100
                    type: object
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ customers:write が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 配列が空または500件超
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/customers/bulk/{batch_id}:
    get:
      tags:
      - 顧客（Customers）
      summary: 顧客一括登録ステータス取得
      description: '`POST /api/v1/customers/bulk` で投入したバッチの進捗と、各レコードの結果を返します。数秒間隔でのポーリングを推奨します（目安は1件あたり約80ミリ秒）。スコープ `customers:write` が必要です。'
      operationId: customersBulkStatus
      parameters:
      - name: batch_id
        in: path
        description: POST /api/v1/customers/bulk が返した batch_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: バッチのステータス
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      batch_id:
                        type: string
                        format: uuid
                        example: b3f1c2a0-9d7e-4c11-88a2-1f0b5c6de9d4
                      status:
                        description: '`pending`（キュー投入済み・未着手）→ `processing` → `completed` / `failed`。一定時間`pending`のまま着手されないバッチは`failed`となり、理由が `failure_reason` に入ります（ポーリングが終わらない状態を避けるため）。'
                        type: string
                        example: completed
                        enum:
                        - pending
                        - processing
                        - completed
                        - failed
                      total:
                        description: 送信されたレコードの総数
                        type: integer
                        example: 100
                      succeeded:
                        type: integer
                        example: 97
                      failed:
                        type: integer
                        example: 3
                      results:
                        description: 登録に成功したレコードごとの結果。完了までは空配列です。
                        type: array
                        items:
                          properties:
                            index:
                              description: 送信したcustomers配列内でのインデックス
                              type: integer
                              example: 0
                            status:
                              type: string
                              example: created
                            customer_id:
                              type: integer
                              example: 78901
                            external_id:
                              type: string
                              example: CRM-LEAD-001
                              nullable: true
                          type: object
                      errors:
                        description: 登録に失敗したレコードごとのエラー詳細。完了までは空配列です。
                        type: array
                        items:
                          properties:
                            index:
                              description: 送信したcustomers配列内でのインデックス
                              type: integer
                              example: 1
                            code:
                              type: string
                              example: duplicate_external_id
                            message:
                              type: string
                              example: Duplicate external_id within the same project.
                          type: object
                      failure_reason:
                        description: '`status` が `failed` の場合のみ設定される失敗理由。それ以外は null です。'
                        type: string
                        example: Queue worker did not start this batch within 15 minutes. The openapi queue is not being consumed on this environment; the records were not created. Re-submit the batch once the worker is running.
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                        example: '2026-08-11T18:47:14+09:00'
                      started_at:
                        type: string
                        format: date-time
                        example: '2026-08-11T18:47:15+09:00'
                        nullable: true
                      completed_at:
                        type: string
                        format: date-time
                        example: '2026-08-11T18:47:53+09:00'
                        nullable: true
                    type: object
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ customers:write が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: バッチが存在しない、または他テナントのバッチです
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/customers/{customerId}:
    get:
      tags:
      - 顧客（Customers）
      summary: 顧客詳細取得
      description: 指定した顧客の詳細情報を取得します。スコープ `customers:read` が必要です。
      operationId: customersShow
      parameters:
      - name: customerId
        in: path
        description: 顧客ID
        required: true
        schema:
          type: integer
          example: 78901
      responses:
        '200':
          description: 顧客詳細
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      customer_id:
                        type: integer
                        example: 78901
                      external_id:
                        type: string
                        example: CRM-LEAD-001
                        nullable: true
                      name:
                        type: string
                        example: 株式会社テスト
                      name_kana:
                        type: string
                        nullable: true
                      tel1:
                        type: string
                        example: 0312345678
                      tel2:
                        type: string
                        nullable: true
                      prefecture:
                        type: string
                        nullable: true
                      address1:
                        type: string
                        nullable: true
                      industry:
                        type: string
                        nullable: true
                      employee_scale:
                        type: string
                        nullable: true
                      custom_fields:
                        type: object
                        nullable: true
                      project_id:
                        type: integer
                        example: 456
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                    type: object
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ customers:read が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 顧客が見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
    put:
      tags:
      - 顧客（Customers）
      summary: 顧客情報更新
      description: 既存の顧客情報を更新します。指定しないフィールドは変更されません。スコープ `customers:write` が必要です。
      operationId: customersUpdate
      parameters:
      - name: customerId
        in: path
        description: 顧客ID
        required: true
        schema:
          type: integer
          example: 78901
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  example: 株式会社テスト（更新）
                  nullable: true
                name_kana:
                  type: string
                  nullable: true
                tel1:
                  description: E.164形式または0始まりの国内形式。区切りのハイフンは可。それ以外の形式は422で拒否されます。nullを送ると値をクリアします。
                  type: string
                  pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                  example: 0312345679
                  nullable: true
                  maxLength: 30
                tel2:
                  description: tel1と同じ形式ルールです。
                  type: string
                  pattern: ^(?:\+[1-9](?:[- ]?\d){7,14}|0(?:[- ]?\d){9,10})$
                  nullable: true
                  maxLength: 30
                prefecture:
                  type: string
                  nullable: true
                address1:
                  type: string
                  nullable: true
                industry:
