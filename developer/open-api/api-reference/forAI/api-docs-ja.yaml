                        nullable: true
                      consecutive_failures:
                        description: 連続した配信試行の失敗回数（再送を含む）。配信が成功すると 0 にリセットされ、10 に達するとWebhookは自動的に無効化されます。
                        type: integer
                        example: 0
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                    type: object
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ webhooks:manage またはライセンス open_api_advanced が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhookが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
    delete:
      tags:
      - Webhook
      summary: Webhook削除
      description: Webhookを削除します。スコープ `webhooks:manage` が必要です。
      operationId: webhooksDestroy
      parameters:
      - name: webhookId
        in: path
        description: WebhookID
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '204':
          description: Webhookが削除されました
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ webhooks:manage またはライセンス open_api_advanced が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhookが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/webhooks/{webhookId}/test:
    post:
      tags:
      - Webhook
      summary: Webhook接続テスト
      description: 登録済みのWebhookに対してテストペイロードを送信し、接続を確認します。スコープ `webhooks:manage` が必要です。
      operationId: webhooksTest
      parameters:
      - name: webhookId
        in: path
        description: WebhookID
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: テスト送信結果
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      success:
                        type: boolean
                        example: true
                      http_status:
                        type: integer
                        example: 200
                      response_time_ms:
                        type: integer
                        example: 142
                    type: object
                type: object
        '401':
          description: APIキーが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: スコープ webhooks:manage またはライセンス open_api_advanced が不足しています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhookが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
components:
  schemas:
    ErrorResponse:
      required:
      - error
      properties:
        error:
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: invalid_api_key
            message:
              type: string
              example: Missing or invalid API key.
            details:
              example: null
              nullable: true
          type: object
      type: object
    ValidationErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: Validation failed.
            details:
              type: object
              example:
                phone_number:
                - The phone number field is required.
          type: object
      type: object
    PaginationMeta:
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 50
        total:
          type: integer
          example: 128
        last_page:
          type: integer
          example: 3
      type: object
    SpeechAnalysis:
      properties:
        talk_ratio:
          description: エージェントの発話比率（0〜1）
          type: number
          format: float
          example: 0.45
        speech_speed:
          description: 発話速度（文字/秒）
          type: number
          format: float
          example: 5.2
        filler_count:
          description: フィラーワードの数
          type: integer
          example: 3
        silence_ratio:
          description: 無音比率
          type: number
          format: float
          example: 0.08
        overlap_count:
          description: 発話の重なり回数
          type: integer
          example: 2
        question_count:
          description: 質問の数
          type: integer
          example: 8
        rally_count:
          description: 発話交代の回数
          type: integer
          example: 15
      type: object
      nullable: true
    CallHistoryItem:
      properties:
        call_id:
          description: 通話履歴ID。GET /api/v1/calls/{callId} のパスパラメータに指定する整数値と同一です。
          type: integer
          format: int64
          example: 150193036
        call_type:
          description: 通話種別。voicemail は自社の留守番電話に録音された着信に加え、相手方の留守番電話に応答された発信も含みます。
          type: string
          example: outbound
          enum:
          - outbound
          - inbound
          - outbound_no_answer
          - inbound_no_answer
          - internal
          - voicemail
          - transfer
          - sms_inbound
          - sms_outbound
          - ivr_outbound
        status:
          type: string
          example: connected
        phone_number:
          type: string
          example: 09012345678
        caller_number:
          type: string
          example: 0312345678
        staff_id:
          type: integer
          example: 123
        staff_name:
          type: string
          example: 田中太郎
        project_id:
          type: integer
          example: 456
        project_name:
          type: string
          example: 営業プロジェクトA
        customer_id:
          type: integer
          example: 78901
          nullable: true
        customer_name:
          type: string
          example: 株式会社テスト
          nullable: true
        started_at:
          type: string
          format: date-time
          example: '2026-03-10T10:00:00+09:00'
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          example: 330
        memo:
          type: string
          example: 商談アポ獲得
          nullable: true
        recall_at:
          type: string
          format: date-time
          nullable: true
        transcription:
          description: 音声テキスト変換
          type: string
          nullable: true
        summary:
          description: AI生成の通話要約
          type: string
          nullable: true
        speech_analysis:
          oneOf:
          - $ref: '#/components/schemas/SpeechAnalysis'
          nullable: true
        recording_url:
          type: string
          format: uri
          nullable: true
        external_id:
          type: string
          example: SF-LEAD-001
          nullable: true
      type: object
    WebhookPayload:
      description: "Comdeskが登録済みWebhook URLへPOSTするリクエストボディ。\n *\n * **配信方法**\n * - `POST <登録したURL>` / `Content-Type: application/json`。配信先は `https://` のみです。\n * - `X-Comdesk-Signature: sha256=<hex>` — Webhook作成時に一度だけ表示されるシークレットを鍵とした、**リクエストボディの生バイト列**に対するHMAC-SHA256。\n * - `X-Comdesk-Event: <イベント名>` — `event` プロパティと同じ値。\n * - `X-Comdesk-Delivery: <event_id>` — `event_id` プロパティと同じ値(`webhook.test` では送信されません)。\n * - `User-Agent: Comdesk-Webhook/1.0`(`webhook.test` は `Comdesk-Webhook-Tester/1.0`)。\n *\n * **署名検証** — 受信した生ボディそのものに対してHMACを計算してください。パースしたJSONを再シリアライズするとバイト列が変わり、検証に失敗します。\n *\n * **配信仕様** — 最大6回試行、バックオフ 1分 → 5分 → 30分 → 2時間 → 24時間。4xx/5xx とタイムアウト(10秒)は再送対象です。再送時も `event_id` は同一のため、受信側は `event_id` による冪等処理を実装してください。\n *\n * **自動無効化** — **連続10回の試行失敗**でWebhookは `is_active: false` となり、`PUT /api/v1/webhooks/{webhookId}` で再有効化するまでイベントを受信しません。カウンタは `consecutive_failures` で、失敗した**試行ごと**に加算されます（再送も含む。イベント単位ではありません）。配信が1回でも成功すると 0 にリセットされます。しきい値は最大試行回数（6回）より大きいため、到達不能なイベント1件だけでWebhookが無効化されることはありません（再送を使い切るイベントが連続で約2件必要です）。\n\
        \ *\n * **`data` の形** は `event` によって決まります。下記のイベント別スキーマを参照してください。"
      required:
      - event_id
      - timestamp
      - event
      - data
      properties:
        event_id:
          description: UUID v4。同一イベントの再送では値が変わらないため、リプレイ/重複排除のキーとして使用できます。
          type: string
          format: uuid
          example: 9b7a1f2c-3d4e-4f50-9a61-2b3c4d5e6f70
        timestamp:
          description: オフセット付きISO8601、Comdeskのアプリタイムゾーン(Asia/Tokyo, +09:00)。dispatch時点で確定し、再送しても変わりません。
          type: string
          format: date-time
          example: '2026-07-15T18:47:14+09:00'
        event:
          description: '`webhook.test` は `POST /api/v1/webhooks/{webhookId}/test` のみが発火するイベントで、購読対象にはできません。`call.failed` と `ivr.trigger` は購読登録できますが、現時点で配信元がありません(予約値)。'
          type: string
          example: call.completed
          enum:
          - call.started
          - call.completed
          - call.missed
          - call.voicemail
          - call.failed
          - customer.created
          - customer.updated
          - transcription.completed
          - summary.completed
          - ivr.trigger
          - webhook.test
        data:
          description: イベント別の本文。どのスキーマを使うかは形ではなく `event` で判断してください(`oneOf` ではなく `anyOf` にしてあります。WebhookCallStartedData は WebhookCallEndedData の部分集合のため、通話終了のペイロードは両方に一致するのが正常です)。call.started → WebhookCallStartedData / call.completed・call.missed・call.voicemail → WebhookCallEndedData / customer.created → WebhookCustomerCreatedData / customer.updated → WebhookCustomerUpdatedData / transcription.completed → WebhookTranscriptionCompletedData / summary.completed → WebhookSummaryCompletedData / ivr.trigger → WebhookIvrTriggerData / call.failed → WebhookCallFailedData / webhook.test → WebhookTestData。
          anyOf:
          - $ref: '#/components/schemas/WebhookCallStartedData'
          - $ref: '#/components/schemas/WebhookCallEndedData'
          - $ref: '#/components/schemas/WebhookCustomerCreatedData'
          - $ref: '#/components/schemas/WebhookCustomerUpdatedData'
          - $ref: '#/components/schemas/WebhookTranscriptionCompletedData'
          - $ref: '#/components/schemas/WebhookSummaryCompletedData'
          - $ref: '#/components/schemas/WebhookIvrTriggerData'
          - $ref: '#/components/schemas/WebhookCallFailedData'
          - $ref: '#/components/schemas/WebhookTestData'
      type: object
    WebhookCallStartedData:
      description: 通話履歴が作成された(発信開始)ときに送信されます。CRMの通話作成経路が配信元です。
      required:
      - call_id
      properties:
        call_id:
          description: 通話履歴ID（整数）。
          type: integer
          format: int64
          example: 1234567
        phone_number:
          type: string
          example: 09012345678
          nullable: true
        staff_id:
          type: integer
          example: 123
          nullable: true
        project_id:
          type: integer
          example: 456
          nullable: true
        started_at:
          type: string
          format: date-time
          example: '2026-07-15T18:42:01+09:00'
          nullable: true
      type: object
    WebhookCallEndedData:
      description: PBXから通話終了が通知されたときに送信されます。`call.completed`=応答あり、`call.missed`=応答なし、`call.voicemail`=留守番電話の録音で終了。
      required:
      - call_id
      properties:
        call_id:
          type: integer
          format: int64
          example: 1234567
        phone_number:
          type: string
          example: 09012345678
          nullable: true
        staff_id:
          type: integer
          example: 123
          nullable: true
        project_id:
          type: integer
          example: 456
          nullable: true
        started_at:
          type: string
          format: date-time
          example: '2026-07-15T18:42:01+09:00'
          nullable: true
        duration_seconds:
          description: 通話時間(秒)。接続しなかった場合は `null`。
          type: integer
          example: 330
          nullable: true
      type: object
    WebhookCustomerCreatedData:
      description: '`POST /api/v1/customers` で新規作成された場合に送信されます。'
      required:
      - customer_id
      properties:
        customer_id:
          type: integer
          format: int64
          example: 78901
        name:
          type: string
          example: テスト株式会社
          nullable: true
        tel1:
          type: string
          example: 0312345678
          nullable: true
        project_id:
          type: integer
          example: 456
          nullable: true
        external_id:
          type: string
          example: SF-LEAD-001
          nullable: true
      type: object
    WebhookCustomerUpdatedData:
      description: '`PATCH /api/v1/customers/{customerId}` で既存レコードが更新された場合に送信されます。'
      required:
      - customer_id
      properties:
        customer_id:
          type: integer
          format: int64
          example: 78901
        changed_fields:
          description: 更新リクエストで送信されたフィールド名の一覧。
          type: array
          items:
            type: string
          example:
          - name
          - tel1
        external_id:
          type: string
          example: SF-LEAD-001
          nullable: true
      type: object
    WebhookTranscriptionCompletedData:
      required:
      - call_id
      - transcription
      properties:
        call_id:
          type: integer
          format: int64
          example: 1234567
        transcription:
          description: 文字起こし結果。先頭5000文字で切り詰められます。全文は `GET /api/v1/calls/{callId}` を参照してください。
          type: string
          example: お世話になります、コムデスクの田中と申します…
          maxLength: 5000
      type: object
    WebhookSummaryCompletedData:
      required:
      - call_id
      - summary
      properties:
        call_id:
          type: integer
          format: int64
          example: 1234567
        summary:
          description: AI要約。先頭5000文字で切り詰められます。
          type: string
          example: 見積もりの依頼があり、来週の折り返しを希望。
          maxLength: 5000
      type: object
    WebhookIvrTriggerData:
      description: IVRセッションを受理・キュー投入したときに送信されます。現時点で配信元がないため配信されません(予約値)。
      required:
      - session_id
      - call_id
      - phone_number
      - project_id
      - initiated_at
      properties:
        session_id:
          description: '`ivr_` + call_id。'
          type: string
          example: ivr_1234567
        call_id:
          type: integer
          format: int64
          example: 1234567
        phone_number:
          type: string
          example: 09012345678
        project_id:
          type: integer
          example: 456
        queue_id:
          type: integer
          example: 12
          nullable: true
        external_id:
          type: string
          example: SF-LEAD-001
          nullable: true
        initiated_at:
          type: string
          format: date-time
          example: '2026-07-15T18:42:01+09:00'
      type: object
    WebhookCallFailedData:
      description: 発信の受け付けは成功したものの、PBXで実際に架電されなかったときに送信されます。現時点で配信元がないため配信されません(予約値)。
      required:
      - call_id
      - reason
      - failed_at
      properties:
        call_id:
          type: integer
          format: int64
          example: 1234567
        customer_id:
          type: integer
          format: int64
          example: 78901
          nullable: true
        reason:
          description: staff_not_dialable=該当スタッフに架電可能なPBXユーザーがない / pbx_unconfigured=当該環境に架電先が未設定 / pbx_host_unknown=スタッフのPBXホストを解決できない / pbx_rejected=PBXが発信を拒否 / pbx_unreachable=リトライ後もPBXに到達できない。
          type: string
          example: pbx_rejected
          enum:
          - staff_not_dialable
          - pbx_unconfigured
          - pbx_host_unknown
          - pbx_rejected
          - pbx_unreachable
        failed_at:
          type: string
          format: date-time
          example: '2026-07-15T18:42:09+09:00'
      type: object
    WebhookTestData:
      description: '`POST /api/v1/webhooks/{webhookId}/test` のみが発火します。購読対象にはできず、再送も行われません。'
      required:
      - webhook_id
      - message
      properties:
        webhook_id:
          type: integer
          example: 1
        message:
          type: string
          example: This is a test event from Comdesk.
      type: object
  securitySchemes:
    BearerAuth:
      type: http
      description: api_keysテーブルのAPIキー。'Bearer 'プレフィックスなしで入力してください。
      scheme: bearer
tags:
- name: 通話（Calls）
  description: 通話（Calls）
- name: 顧客（Customers）
  description: 顧客（Customers）
- name: レポート（Reports）
  description: レポート（Reports）
- name: Webhook
  description: Webhook
